    // --- Sound Effects Utility (Web Audio API) ---
    class SoundEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playAlert() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(850, now);
          osc.frequency.setValueAtTime(1150, now + 0.15);
          osc.frequency.setValueAtTime(850, now + 0.3);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        } catch(e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.55);
        } catch(e) {}
      }
      playPop() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } catch(e) {}
      }

                  {/* Description & Distinguishing Marks */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">تفاصيل الفقدان ووقت المحاضرة</label>
                      <textarea
                        name="description"
                        rows={2}
                        placeholder="مثال: فقدته أثناء محاضرة الذكاء الاصطناعي الساعة 1 ظهر اليوم..."
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">علامات مميزة أو مواصفات خاصة</label>
                      <textarea
                        name="keyDetails"
                        rows={2}
                        placeholder="مثال: عليه غلاف شفاف، ستيكر، لون خاص..."
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
                      />
                    </div>
                  </div>

                  {/* Optional Image URL */}
                  <div>
                    <label className="text-xs font-bold text-slate-300 mb-1 block">رابط صورة للغرض (اختياري)</label>
                    <input
                      name="imageUrl"
                      type="url"
                      placeholder="https://images.unsplash.com/..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  {/* Contact Info (If not logged in) */}
                  {!currentUser && (
                    <div className="grid grid-cols-3 gap-2 border-t border-slate-800 pt-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 block mb-1">اسمك</label>
                        <input name="reporterName" type="text" required placeholder="اسم الطالب" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 block mb-1">رقم الجوال</label>
                        <input name="reporterPhone" type="tel" required placeholder="05xxxxxxxx" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 block mb-1">الرقم الجامعي</label>
                        <input name="studentId" type="text" required placeholder="44xxxxxx" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 rounded-2xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-black text-xs shadow-xl shadow-rose-600/30 transition-all flex items-center justify-center gap-2"
                  >
                    <span>🚨</span>
                    <span>نشر البلاغ وإشعار الكلية والقاعة فوراً</span>
                  </button>

                </form>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 3: REPORT FOUND ITEM (وجدت غرضاً) */}
          {/* ======================================================== */}
          {isFoundModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
              <div className="glass-modal rounded-3xl max-w-xl w-full p-6 border border-emerald-500/40 shadow-2xl relative my-8 animate-in fade-in zoom-in-95 duration-200">
                
                <button
                  onClick={() => setIsFoundModalOpen(false)}
                  className="absolute top-5 left-5 text-slate-400 hover:text-white p-2 rounded-xl bg-slate-800/60 hover:bg-slate-800"
                >
                  ✕
                </button>

                <div className="flex items-center gap-3 mb-5 border-b border-slate-800 pb-3">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl shrink-0">
                    ✨
                  </div>
                  <div>
                    <h2 className="text-lg font-black text-white">إبلاغ عن غرض معثور عليه</h2>
                    <p className="text-xs text-slate-400">ساعد زميلك وحدد أين عثرت عليه وأين تم وضعه للاستلام</p>
                  </div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleAddFound({
                    title: e.target.title.value,
                    category: e.target.category.value,
                    building: e.target.building.value,
                    floor: e.target.floor.value,
                    room: e.target.room.value,
                    foundLocation: e.target.foundLocation.value,
                    specificLocation: e.target.specificLocation.value,
                    description: e.target.description.value,
                    imageUrl: e.target.imageUrl.value || 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=600&q=80',
                    reporterName: e.target.reporterName?.value,
                    reporterPhone: e.target.reporterPhone?.value
                  });
                }} className="space-y-4">

                  {/* Title & Category */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">وصف الغرض المعثور عليه</label>
                      <input
                        name="title"
                        type="text"
                        placeholder="مثال: عثرت على سماعة AirPods، محفظة، مفتاح"
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">فئة الغرض</label>
                      <select
                        name="category"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                      >
                        {CATEGORIES.filter(c => c.id !== 'all').map(c => (
                          <option key={c.id} value={c.id}>{c.icon} {c.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Location Specifics */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">المبنى</label>
                      <select
                        name="building"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                      >
                        {BUILDINGS.map(b => (
                          <option key={b.id} value={b.name}>{b.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 mb-1 block">الدور</label>
                      <select
                        name="floor"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                      >
                        <option value="الدور الأرضي">الدور الأرضي</option>
                        <option value="الدور الأول">الدور الأول</option>
                        <option value="الدور الثاني" selected>الدور الثاني</option>
                        <option value="الدور الثالث">الدور الثالث</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-emerald-300 mb-1 block">القاعة أو المعمل</label>
                      <input
                        name="room"
                        type="text"
                        placeholder="مثال: قاعة 202"
                        defaultValue="قاعة 202"
                        required
                        className="w-full bg-slate-900 border border-emerald-500/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400 font-bold"
                      />
                    </div>
                  </div>

                  {/* Exact Found Location & Where is it deposited now */}
                  <div className="bg-emerald-950/40 p-3 rounded-2xl border border-emerald-500/40 space-y-2">
                    <label className="text-xs font-bold text-emerald-300 block">
                      📍 أين وجدته بالضبط وأين هو الآن؟ (مكان الاستلام)
                    </label>
                    <input
                      name="foundLocation"
                      type="text"
                      placeholder="مثال: وجدته تحت منصة قاعة 202 وتم تسليمه لمكتب الأمن بغرفة 104"
                      required
                      className="w-full bg-slate-900 border border-emerald-500/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400 font-bold"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 mb-1 block">ملاحظات إضافية لمساعدة صاحبه</label>
                    <textarea
                      name="description"
                      rows={2}
                      placeholder="أي تفاصيل عن الغرض بدون ذكر البيانات الحساسة..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 mb-1 block">رابط صورة (اختياري)</label>
                    <input
                      name="imageUrl"
                      type="url"
                      placeholder="https://..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-xl shadow-emerald-600/30 transition-all flex items-center justify-center gap-2"
                  >
                    <span>✨</span>
                    <span>توثيق ونشر الغرض المعثور عليه</span>
                  </button>

                </form>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 4: IN-APP CHAT & LOCATION UPDATES */}
          {/* ======================================================== */}
          {chatReport && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
              <div className="glass-modal rounded-3xl max-w-lg w-full flex flex-col h-[560px] border border-cyan-500/40 shadow-2xl relative my-8 animate-in fade-in zoom-in-95 duration-200 overflow-hidden">
                
                {/* Chat Header */}
                <div className="p-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center font-bold text-lg">
                      💬
                    </div>
                    <div>
                      <h3 className="font-black text-sm text-white">{chatReport.title}</h3>
                      <p className="text-[11px] text-cyan-400 font-bold">
                        📍 {chatReport.room} • {chatReport.building}
                      </p>
                    </div>
                  </div>
                  
                  <button
                    onClick={() => setChatReport(null)}
                    className="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-800"
                  >
                    ✕
                  </button>
                </div>

                {/* Found Location Status Banner in Chat */}
                {chatReport.foundLocation && (
                  <div className="bg-emerald-950/80 p-3 border-b border-emerald-500/40 text-xs text-emerald-200 flex items-start gap-2">
                    <span className="text-base">📍</span>
                    <div>
                      <strong className="block text-emerald-300">مكان الغرض المسجل:</strong>
                      <p className="text-white font-bold">{chatReport.foundLocation}</p>
                    </div>
                  </div>
                )}

                {/* Messages Body */}
                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-950/40">
                  {chatReport.messages && chatReport.messages.length > 0 ? (
                    chatReport.messages.map(m => (
                      <div
                        key={m.id}
                        className={`p-3 rounded-2xl text-xs max-w-[85%] leading-relaxed ${
                          m.role === 'system'
                            ? 'mx-auto bg-slate-900/90 text-cyan-300 border border-cyan-500/30 text-center font-bold'
                            : m.role === 'security'
                            ? 'mr-auto bg-emerald-950 border border-emerald-500/40 text-emerald-100'
                            : 'ml-auto bg-slate-800/90 text-slate-100 border border-slate-700/60'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-3 text-[10px] text-slate-400 mb-1 font-bold">
                          <span>{m.sender}</span>
                          <span>{m.time}</span>
                        </div>
                        <p>{m.text}</p>
                        {m.isLocationUpdate && (
                          <div className="mt-2 pt-1 border-t border-emerald-500/30 text-emerald-300 font-bold text-[11px]">
                            📍 {m.locationText}
                          </div>
                        )}
                      </div>
                    ))
                  ) : (
                    <div className="text-center py-10 text-xs text-slate-500">
                      لا توجد رسائل سابقة. يمكنك إرسال استفسار أو تحديث المكان الآن.
                    </div>
                  )}
                </div>

                {/* Quick WhatsApp / Phone Contact Action */}
                {chatReport.reporterPhone && (
                  <div className="px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs">
                    <span className="text-slate-400">هاتف صاحب البلاغ: <strong className="text-white font-mono">{chatReport.reporterPhone}</strong></span>
                    <a
                      href={`https://wa.me/966${chatReport.reporterPhone.replace(/^0/, '')}`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-[11px] flex items-center gap-1"
                    >
                      <span>واتساب</span> 💬
                    </a>
                  </div>
                )}

                {/* Message Input Box */}
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const txt = e.target.msg.value;
                  handleSendMessage(chatReport.id, txt);
                  e.target.msg.value = '';
                }} className="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                  <input
                    name="msg"
                    placeholder="اكتب رسالة أو استفساراً عن مكان الغرض..."
                    required
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-xs transition-all shadow"
                  >
                    إرسال
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 5: FULL REPORT DETAILS PREVIEW */}
          {/* ======================================================== */}
          {selectedReportDetail && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
              <div className="glass-modal rounded-3xl max-w-lg w-full p-6 border border-slate-700 shadow-2xl relative my-8 animate-in fade-in zoom-in-95 duration-200 space-y-4">
                
                <button
                  onClick={() => setSelectedReportDetail(null)}
                  className="absolute top-5 left-5 text-slate-400 hover:text-white p-2 rounded-xl bg-slate-800"
                >
                  ✕
                </button>

                <div className="flex items-start gap-3 border-b border-slate-800 pb-4">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center text-2xl shrink-0">
                    {selectedReportDetail.type === 'lost' ? '🚨' : '✨'}
                  </div>
                  <div>
                    <span className="text-[10px] text-cyan-400 font-mono font-bold">{selectedReportDetail.id}</span>
                    <h2 className="text-lg font-black text-white">{selectedReportDetail.title}</h2>
                    <p className="text-xs text-slate-400">{selectedReportDetail.categoryName} • {new Date(selectedReportDetail.dateReported).toLocaleDateString('ar-SA')}</p>
                  </div>
                </div>

                {selectedReportDetail.imageUrl && (
                  <div className="rounded-2xl overflow-hidden h-48 bg-slate-900 border border-slate-800">
                    <img src={selectedReportDetail.imageUrl} alt={selectedReportDetail.title} className="w-full h-full object-cover" />
                  </div>
                )}

                {/* Location Box (Comprehensive) */}
                <div className="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
                  <h4 className="font-black text-cyan-300 flex items-center gap-1.5">
                    <span>📍</span> بيانات الموقع والقاعة الجامعية:
                  </h4>
                  <div className="grid grid-cols-2 gap-2 text-slate-300">
                    <div><strong>المبنى:</strong> {selectedReportDetail.building}</div>
                    <div><strong>الدور:</strong> {selectedReportDetail.floor || 'الدور الأول'}</div>
                    <div className="col-span-2"><strong>رقم القاعة:</strong> <span className="text-white font-bold">{selectedReportDetail.room}</span></div>
                    {selectedReportDetail.specificLocation && (
                      <div className="col-span-2 text-slate-300 bg-slate-950 p-2 rounded-xl border border-slate-800/80">
                        <strong>المكان الدقيق داخل القاعة:</strong> {selectedReportDetail.specificLocation}
                      </div>
                    )}
                  </div>
                </div>

                {/* Description */}
                <div className="text-xs text-slate-300 bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80 leading-relaxed">
                  <strong className="block text-white mb-1">وصف الغرض:</strong>
                  {selectedReportDetail.description}
                  {selectedReportDetail.keyDetails && (
                    <p className="mt-2 text-slate-400 border-t border-slate-800 pt-1">
                      <strong>علامات مميزة:</strong> {selectedReportDetail.keyDetails}
                    </p>
                  )}
                </div>

                {/* Found Location Status */}
                {selectedReportDetail.foundLocation && (
                  <div className="bg-emerald-950/70 p-3 rounded-2xl border border-emerald-500/40 text-xs">
                    <strong className="text-emerald-300 block mb-0.5">مكان العثور والاستلام:</strong>
                    <p className="text-white font-bold">{selectedReportDetail.foundLocation}</p>
                  </div>
                )}

                {/* Actions */}
                <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => {
                      const rep = selectedReportDetail;
                      setSelectedReportDetail(null);
                      setChatReport(rep);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs transition-all shadow"
                  >
                    فتح المحادثة والتواصل 💬
                  </button>

                  {selectedReportDetail.reporterPhone && (
                    <a
                      href={`tel:${selectedReportDetail.reporterPhone}`}
                      className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-xs border border-emerald-500/30"
                    >
                      📞 اتصال
                    </a>
                  )}
                </div>

              </div>
            </div>
          )}

        </div>
      );

      // Device Simulator Frame Rendering if selected
      if (deviceMode === 'iphone') {
        return (
          <div className="min-h-screen bg-slate-900/90 py-8 px-4 flex flex-col items-center">
            <div className="flex items-center justify-between w-full max-w-[420px] mb-3 text-xs text-slate-400">
              <span className="font-bold text-cyan-400">📱 وضع محاكاة الآيفون (iPhone iOS)</span>
              <button onClick={() => setDeviceMode('auto')} className="text-slate-300 hover:text-white underline">
                شاشة كاملة ✕
              </button>
            </div>
            <div className="iphone-frame w-full">
              <div className="iphone-island">
                <span className="text-[9px] text-cyan-400 font-mono">9:41</span>
                <div className="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700"></div>
                <span className="text-[9px] text-slate-400">5G 100%</span>
              </div>
              <div className="h-[800px] overflow-y-auto">
                {renderContent()}
              </div>
            </div>
          </div>
        );
      }

      if (deviceMode === 'android') {
        return (
          <div className="min-h-screen bg-slate-900/90 py-8 px-4 flex flex-col items-center">
            <div className="flex items-center justify-between w-full max-w-[430px] mb-3 text-xs text-slate-400">
              <span className="font-bold text-emerald-400">🤖 وضع محاكاة الأندرويد (Android)</span>
              <button onClick={() => setDeviceMode('auto')} className="text-slate-300 hover:text-white underline">
                شاشة كاملة ✕
              </button>
            </div>
            <div className="android-frame w-full">
              <div className="android-camera"></div>
              <div className="h-[800px] overflow-y-auto">
                {renderContent()}
              </div>
            </div>
          </div>
        );
      }

      // Default (Responsive Auto: PC, Laptop, Native Mobile)
      return renderContent();
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<CollegeLostAndFoundApp />);
  </script>
</body>
</html>
